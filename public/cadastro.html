<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Tactics - Cadastro</title>
    <link rel="stylesheet" href="./css/style-cadastro.css">
</head>

<body>

    <div class="card-pai">
        <div class="card-img">
            <div class="row"><img src="./assets/img/DATA_FOOTBALL_branco-removebg-preview.png" alt=""></div>
        </div>
        <div class="card-principal">
            <div class="card-form">
                <form id="form_cadastro">
                <h1>Faça parte da equipe!</h1>
                <h2>Preencha as informaçãos abaixo para se cadastrar</h2>
                <label>Informe o seu nome</label><br>
                <input type="text" id="ipt_nome" placeholder="Ex: Seu nome"><br>
                <label>Informe o seu email</label><br>
                <input type="text" id="ipt_email" placeholder="Ex: endereco@contato.com"><br>
                <label>Informe o seu telefone</label><br>
                <input type="text" id="ipt_telefone" placeholder="Ex: (xx) xxxxx-xxxx"><br>
                <label>Informe o seu nome de usuário</label><br>
                <input type="text" id="ipt_user" placeholder="Ex: Usuario123"><br>
                <label>Informe o time que você torçe</label><br>
                <input type="text" id="ipt_time" placeholder="Ex: Time FC"><br>
                <label>De 0 a 10, qual o seu conhecimento de futebol?</label><br>
                <input type="text" id="ipt_conhecimento" placeholder="Ex: 5"><br>
                <label>Informe uma senha</label><br>
                <input type="password" id="ipt_senha" placeholder="********"><br>
                <label>Informe a senha novamente</label><br>
                <input type="password" id="ipt_conf_senha" placeholder="********"><br><br>
                
            </form>
            <div class="card-botoes">
                    <button onclick="cadastrar()" id="cadastrar" class="botao-form">Cadastrar</button><br>
            </div><br>
            </div>
        </div>
            <div class="teste"></div>
        </div>
    </div>
</body>
<script>
    let Cadastro = JSON.parse(localStorage.getItem('DadosCadastrados')) || []
    function cadastrar() {
        let nome = ipt_nome.value
        let email = ipt_email.value
        let telefone = ipt_telefone.value
        let user_name = ipt_user.value
        let conhecimento = ipt_conhecimento.value
        let time = ipt_time.value
        let senha = ipt_senha.value
        let conf_senha = ipt_conf_senha.value
        let com = email.indexOf('.com');
        let arroba = email.indexOf('@');
        let arroba_antes_com = arroba < com;
        let validacao_user = 0
        if (nome.length <= 0 || email.length <= 0 || telefone.length <= 0 || user_name.length <= 0 || conhecimento.length <= 0 || time.length <= 0 || senha.length <= 0 || conf_senha.length <= 0) {
            alert("Insira todas as informações para concluir o cadastro")
        } else {
            for (let i = 0; i < Cadastro.length; i++) {
                    if (Cadastro[i].User == user_name) {
                        validacao_user = 1
                        i = Cadastro.length
                    }
            }
            if (arroba == -1) {
                alert('O email precisa ter @')
            } else if (arroba == 0) {
                alert('Insira caracteres antes do @')
            } else if (arroba_antes_com == false) {
                alert('Formato de e-mail inválido. O "@" deve vir antes do ".com"')
            } else if (validacao_user == 1) {
               alert('Este usuário já existe')
            } else if (conhecimento < 0 || conhecimento > 10) {
                alert('Insira um valor de 0 a 10')
            } else if (senha.length < 8) {
                alert('A senha precisa ter 8 ou mais caracteres')
            } else if (senha != conf_senha) {
                alert('As senhas não coincidem!')
            } else{
                Cadastro.push({
                    Nome: nome,
                    Email: email,
                    Telefone: telefone,
                    User: user_name,
                    Conhecimento: conhecimento,
                    Time: time,
                    Senha: senha
                })
                localStorage.setItem ('DadosCadastrados', JSON.stringify(Cadastro))
                alert('Cadastro concluído! Aguarde o redirecionamento')
                ipt_nome.value = '';
                ipt_email.value = '';
                ipt_telefone.value = '';
                ipt_user.value = '';
                ipt_conhecimento.value = '';
                ipt_conf_senha.value = '';
                ipt_senha.value = '';
                ipt_time.value = '';
                setTimeout(() => {
                    window.location.href = 'login.html'
                }, 3000)
            }
            
        }
    }
</script>
</html>
