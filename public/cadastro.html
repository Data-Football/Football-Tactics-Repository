<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Tactics - Cadastro</title>
    <link rel="icon" type="image/png" href="./assets/img/football_tactics_remove.png">
    <link rel="stylesheet" href="./css/style-cadastro.css">
</head>

<body onload="listar(), times()">

    <div class="card-pai">
        <div class="card-img">
            <div class="row"><img src="./assets/img/DATA_FOOTBALL_branco-removebg-preview.png" alt=""></div>
        </div>
        <div class="card-principal">
            <div class="card-form">
                <form id="form_cadastro">
                    <h1>Faça parte da equipe!</h1>
                    <h2>Preencha as informaçãos abaixo para se cadastrar</h2>
                    <div id="div_avisos" class="card-avisos"></div>
                    <label>Informe o seu nome</label><br>
                    <input type="text" id="ipt_nome" placeholder="Ex: Seu nome"><br>
                    <label>Informe o seu email</label><br>
                    <input type="text" id="ipt_email" placeholder="Ex: endereco@contato.com" onkeyup="validacoes()"><br>
                    <div id="div_msg_email"></div>
                    <label>Informe o seu telefone</label><br>
                    <input type="tel" id="ipt_telefone" maxlength="15" placeholder="Ex: (xx) xxxxx-xxxx" onkeyup="validacoes()" oninput="formatarTelefone()"><br>
                    <div id="div_msg_telefone"></div>
                    <label>Informe o seu nome de usuário</label><br>
                    <input type="text" id="ipt_user" placeholder="Ex: Usuario123"  onkeyup="validacoes()"><br>
                    <div id="div_user_name"></div>
                    <label>Informe o time que você torçe</label><br>
                    <select name="" id="sel_times" style="width: 100%;"></select><br>
                    <label>De 0 a 10, qual o seu conhecimento de futebol?</label><br>
                    <input type="text" id="ipt_conhecimento" placeholder="Ex: 5" onkeyup="validacoes()"><br>
                    <div id="div_msg_conhecimento"></div>
                    <label>De 0 a 10, qual o seu conhecimento de tática?</label><br>
                    <input type="text" id="ipt_tatica" placeholder="Ex: 8" onkeyup="validacoes()"><br>
                    <div id="div_msg_tatica"></div>
                    <label>Informe uma senha</label><br>
                    <input type="password" id="ipt_senha" placeholder="********" onkeyup="validacoes()"><br>
                    <div id="div_msg_senha"></div>
                    <label>Informe a senha novamente</label><br>
                    <input type="password" id="ipt_conf_senha" placeholder="********" onkeyup="validacoes()"><br>
                    <div id="div_msg_confsenha"></div>
                    <div id="div_conf_senha"></div>
                </form><br>
                <div class="card-botoes">
                    <button onclick="cadastrar()" id="btn_cadastrar" class="botao-form">Cadastrar</button><br>
                </div><br>

            </div>
        </div>
        <div class="teste">
        </div>
    </div>
    </div>
</body>
<script>
    let Cadastro = []
    let Equipes = []
    let validacao_ok = false
    function formatarTelefone() {
        let telefone = ipt_telefone.value.replace(/\D/g, '');
        if (telefone.length > 11) {
            telefone = telefone.slice(0, 11);
        }
        if (telefone.length > 7) {
            ipt_telefone.value = `(${telefone.slice(0, 2)}) ${telefone.slice(2, 7)}-${telefone.slice(7)}`;
        } else if (telefone.length > 2) {
            ipt_telefone.value = `(${telefone.slice(0, 2)}) ${telefone.slice(2)}`;
        } else if (telefone.length > 0) {
            ipt_telefone.value = `(${telefone}`;
        }
    }
    function validacoes() {
        div_user_name.innerHTML = ''
        div_msg_email.innerHTML = ''
        div_msg_conhecimento.innerHTML = ''
        div_msg_tatica.innerHTML = ''
        div_msg_senha.innerHTML = ''
        div_msg_confsenha.innerHTML = ''
        let conhecimento_verificacao = ipt_conhecimento.value.trim();
        let tatica_verificacao = ipt_tatica.value.trim();
        let senha = ipt_senha.value
        let conf_senha = ipt_conf_senha.value
        let nome = ipt_nome.value
        let email = ipt_email.value.trim()
        let telefone = ipt_telefone.value
        let conhecimento = Number(conhecimento_verificacao);
        let tatica = Number(tatica_verificacao);
        let user_name = ipt_user.value.trim()
        let time = Number(sel_times.value)
        let ponto = email.indexOf('.');
        let arroba = email.indexOf('@');
        let ponto_depois_arroba = arroba < ponto
        validacao_ok = true

        for (let i = 0; i < Cadastro.length; i++) {
            if (Cadastro[i].user_name == ipt_user.value) {
                div_user_name.innerHTML = '<span style="color: red;">O nome do usuário já foi selecionado</span>'
                console.log('Usuário não pode ser cadastrado')
                validacao_ok = false
                break
            }
        }
        if (arroba == -1) {
            div_msg_email.innerHTML = '<span style="color: red;">O email precisa de @</span>'
            validacao_ok = false
        } else if (arroba == 0) {
            div_msg_email.innerHTML = '<span style="color: red;">Insira caracteres antes do @</span>'
            validacao_ok = false
        } else if (ponto_depois_arroba == false) {
            div_msg_email.innerHTML = '<span style="color: red;">Formato de e-mail inválido</span>'
            validacao_ok = false
        }
        if (ipt_conhecimento.value.trim() == '' || conhecimento < 0 || conhecimento > 10 || isNaN(conhecimento)) {
            div_msg_conhecimento.innerHTML = '<span style="color: red;">Informe um número de 0 a 10</span>'
            validacao_ok = false
        }
        if (ipt_tatica.value.trim() == '' || tatica < 0 || tatica > 10 || isNaN(tatica)) {
            div_msg_tatica.innerHTML = '<span style="color: red;">Informe um número de 0 a 10</span>'
            validacao_ok = false
        }
        if (senha.length < 8) {
            div_msg_senha.innerHTML = '<span style="color: red;"> A senha precisa ter 8 ou mais caracteres</span>'
            validacao_ok = false
        }
        if (conf_senha != senha) {
            div_msg_confsenha.innerHTML = '<span style="color: red;">As senhas precisam ser iguais</span>'
            validacao_ok = false
        }
    }
    function times() {
        fetch("/lista/listar", {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_TIME = JSON.stringify(json.id);
                    Equipes = json
                    for (let i = 0; i < Equipes.length; i++) {
                        let equipeAtual = Equipes[i];
                        sel_times.innerHTML += `<option value="${equipeAtual.id}">${equipeAtual.time}</option>`;
                    }
                });

            } else {
                console.log("Houve um erro ao tentar listar as equipes!");

            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
    function cadastrar() {
        let nome = ipt_nome.value
        let email = ipt_email.value
        let telefone = ipt_telefone.value
        let user_name = ipt_user.value
        let conhecimento = Number(ipt_conhecimento.value)
        let tatica = Number(ipt_tatica.value)
        let time = Number(sel_times.value)
        let senha = ipt_senha.value
        let conf_senha = ipt_conf_senha.value
        if (nome == '' || email == '' || telefone == '' || user_name == '' || isNaN(conhecimento) || isNaN(tatica) || time == 0 || senha == '' || conf_senha == '') {
            div_avisos.innerHTML = '<span style="color: white;">Preencha todos os campos</span>'
        } else {
            validacoes()
            if (validacao_ok == false) {
                div_avisos.innerHTML = '<span style="color: red;">Houve um erro para realizar o seu cadastro, preencha as informações novamente</span>'
                ipt_senha.value = '';
                ipt_conf_senha.value = '';
            } else {
                fetch("/usuarios/cadastrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        Nome: nome,
                        User: user_name,
                        Email: email,
                        Senha: senha,
                        Telefone: telefone,
                        Time: time,
                        Conhecimento: conhecimento,
                        Tatica: tatica
                    }),
                })
                    .then(function (resposta) {
                        console.log("resposta: ", resposta);
                        if (resposta.ok) {
                            div_avisos.innerHTML = 'Cadastro concluído! Aguarde o redirecionamento'
                            limparFormulario()
                            setTimeout(() => {
                                window.location.href = 'login.html'
                            }, 3000)

                        } else {
                            throw "Houve um erro ao tentar realizar o cadastro!";
                        }
                    })
                    .catch(function (resposta) {
                        console.log(`#ERRO: ${resposta}`)
                    });

                return false;
            }


        }

    }
    function limparFormulario() {
        ipt_nome.value = '';
        ipt_email.value = '';
        ipt_telefone.value = '';
        ipt_user.value = '';
        ipt_conhecimento.value = '';
        ipt_conf_senha.value = '';
        ipt_senha.value = '';
        ipt_tatica.value = '';
    }
    function listar() {
        fetch("/quiz/listar", {
            method: "GET",
        })
            .then(function (resposta) {
                resposta.json().then((user) => {
                    user.forEach((user_name) => {
                        Cadastro.push(user_name);
                        console.log("Cadastro")
                        console.log(Cadastro[0].user_name)
                    });
                });
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });
    }

</script>

</html>
