            },
            options: {
                responsive: true,

                },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { display: false },
                    x: { display: false }

                plugins: {

        function obterDadosGrafico() {

            fetch(`/dash/ultimas/dados`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                        resposta.reverse();
                        plotarGraficoQuiz(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });

            fetch(`/dash/ultimas/conhecimento`, { cache: 'no-store' }).then(function (response) {

                } else {

                }

                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });

            fetch(`/dash/ultimas/medias`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        resposta.reverse();
                        plotarKpis(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
            fetch(`/dash/ultimas/times`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                        resposta.reverse();
                        plotarTimes(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
        }

        function plotarTimes(resposta) {
            console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarTimes":')
            console.log(resposta)
            ranking.innerHTML = `<tr>
                                <th>Posição</th>
                                <th>Equipe</th>
                                <th>Quantidade Escolhida</th>
                                </tr>`
            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                ranking.innerHTML += `
                    <tr>
                    <td>${i + 1}</td>
                    <td>${registro.time}</td>
                    <td>${registro.qtd_times_escolhidos}</td>
                    </tr>`;
            }
            
            setTimeout(() => atualizarGrafico(), 5000);
        }

        function plotarKpis(resposta) {

        
            console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarKpis":')
            console.log(resposta)

            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                media_quiz.innerHTML = `${registro.media_acerto_quiz}%`
                media_tatica.innerHTML = `${registro.media_tatica}%`
                media_futebol.innerHTML = `${registro.media_conhecimento}%`
                if (registro.media_conhecimento < 50) {
                    infos_kpi1.innerHTML = '<span style="color: #d90429;">Abaixo de 50%: revise os conteúdos introdutórios do blog.</span>';
                } else {
                    infos_kpi1.innerHTML = '<span style="color: #00994d;">Acima de 50%: bom nível de conhecimento geral do público.</span>';
                }
                if (registro.media_tatica < 50) {
                    infos_kpi2.innerHTML = '<span style="color: #d90429;">Abaixo de 50%: reforce os artigos de formações e estilos de jogo.</span>';
                } else {
                    infos_kpi2.innerHTML = '<span style="color: #00994d;">Acima de 50%: público com bom domínio tático.</span>';
                }
                if (registro.media_acerto_quiz <= 50) {
                    infos_kpi3.innerHTML = '<span style="color: #d90429;">Abaixo do esperado: revise a dificuldade das perguntas.</span>';
                } else {
                    infos_kpi3.innerHTML = '<span style="color: #00994d;">Acima do esperado: ótimo desempenho geral no quiz.</span>';
                }
            }
            
             setTimeout(() => atualizarGrafico(), 5000);
        }
        function plotarGraficoQuiz(resposta) {

    
            console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGraficoQuiz":')
            console.log(resposta)

            chartUserQuiz.data.labels = [];
            chartUserQuiz.data.datasets[0].data = [];

            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                chartUserQuiz.data.labels.push(registro.nome);
                chartUserQuiz.data.datasets[0].data.push(registro.acertos);
            }

            chartUserQuiz.update();

            console.log('O gráfico será plotado com os respectivos valores:')

        function plotarGraficoConhecimento(resposta) {

            console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGraficoConhecimento":')

            chartUserCad.data.datasets[0].data = [];

    
            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                chartUserCad.data.labels.push(registro.nivel_conhecimento);
                chartUserCad.data.datasets[0].data.push(registro.qtd_usuarios);

            console.log(labels)
            console.log('Dados:')
            console.log(dados.datasets)
      
            setTimeout(() => atualizarGrafico(), 5000);

        function plotarGraficoSugestoes(resposta) {

            console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGraficoSugestoes":')
            console.log(resposta)

            chartSugestoes.data.labels = [];
            chartSugestoes.data.datasets[0].data = [];

            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                chartSugestoes.data.labels.push(registro.tipo_sugestao);
                chartSugestoes.data.datasets[0].data.push(registro.total);
            }


            chartSugestoes.update();

            console.log('Labels:')
            console.log(labels)
            console.log('Dados:')
            console.log(dados.datasets)

            setTimeout(() => atualizarGrafico(), 5000);
        }


        function atualizarGrafico() {
            fetch(`/dash/ultimas/dados`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (novoRegistro) {
                        console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                        console.log(`Dados atuais do gráfico:`);

                        if (novoRegistro[0].nome == chartUserQuiz.data.labels[chartUserQuiz.data.labels.length - 1]) {
                            console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        } else {
                            chartUserQuiz.data.labels.shift(); // apagar o primeiro
                            chartUserQuiz.data.labels.push(novoRegistro[0].nome); // incluir um novo momento
                            chartUserQuiz.data.datasets[0].data.shift();  // apagar o primeiro de temperatura
                            chartUserQuiz.data.datasets[0].data.push(novoRegistro[0].acertos); // incluir uma nova medida de temperatura
                            chartUserQuiz.update();
                        }
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
                fetch(`/dash/ultimas/conhecimento`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (novoRegistro) {
                        console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                        console.log(`Dados atuais do gráfico:`);

                        if (novoRegistro[0].nivel_conhecimento == chartUserCad.data.labels[chartUserCad.data.labels.length - 1]) {

                            chartUserCad.data.labels.push(novoRegistro[0].nivel_conhecimento); // incluir um novo momento

                            chartUserCad.data.datasets[0].data.push(novoRegistro[0].qtd_usuarios); // incluir uma nova medida de temperatura

                        chartSugestoes.data.labels = [];

            })

                });
                fetch(`/dash/ultimas/medias`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (novoRegistro) {

                    if (`${novoRegistro[0].media_acerto_quiz}%` == media_quiz.innerHTML) {
                    console.log("Sem alteração na média do quiz.");

                    }
                    if (`${novoRegistro[0].media_tatica}%` == media_tatica.innerHTML) {
                        console.log("Sem alteração na média de conhecimento tático.");
                    } else {
                        media_tatica.innerHTML = `${novoRegistro[0].media_tatica}%`;
                    }
                    if (`${novoRegistro[0].media_conhecimento}%` == media_futebol.innerHTML) {
                        console.log("Sem alteração na média de futebol.");
                    } else {
                        media_futebol.innerHTML = `${novoRegistro[0].media_conhecimento}%`;
                    }
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');

            })

                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
                fetch(`/dash/ultimas/times`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (novoRegistro) {

                        ranking.innerHTML = ''
                        ranking.innerHTML = `<tr>

                            var registro = novoRegistro[i];

            })

                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);

        }
