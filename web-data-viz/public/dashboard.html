<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style-dash.css">
    <link rel="icon" type="image/png" href="./assets/img/football_tactics_remove.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/sessao.js"></script>
    <title>Football Tactics - Dashboard</title>
</head>

<body onload="obterDadosGrafico()">
    <header>
        <nav class="card-navbar txt-nav">
            <img src="./assets/img/DATA_FOOTBALL_branco-removebg-preview.png" alt="Logo da Football Tactics"
                class="img-nav">
            <button class="button-login" id="button_paginas"></button>
        </nav>
    </header>
    <div class="card-kpis">
        <div class="card-kpi-left">
            <h3>Média de conhecimento de futebol</h3>
            <span id="media_futebol"></span>
            <h4></h4>
        </div>
        <div class="card-kpi-center">
            <h3>Média de conhecimento tático</h3>
            <span id="media_tatica"></span>
            <h4></h4>
        </div>
        <div class="card-kpi-right">
            <h3>Média de acertos no quiz</h3>
            <span id="media_quiz"></span>
            <h4></h4>
        </div>
    </div>
    <div class="card-pai">
        <div class="card-left">
            <h3 class="txt-roxo">Analise Conhecimento Tático Usuário</h3>
            <div class="grafico-size grafico-nivel">
                <canvas id="user_card"></canvas>
            </div>
            <h3 class="txt-roxo">Sugestões recebidas</h3>
            <div class="grafico-sugestoes">
                <div style="margin: 10px;">
                    <canvas id="sugestoes"></canvas>
                </div>
            </div>
        </div>
        <div class="card-right">
            <h3 class="txt-roxo">Top 5 usuários com mais acerto</h3>
            <div class="grafico-quiz">
                <canvas id="quiz_usuarios"></canvas>
            </div>
            <h3 class="txt-roxo">Ranking de acertos de perguntas</h3>
            <div class="card-table">
                <table id="ranking">
                    <tr>
                        <th>Perguntas</th>
                        <th>Percentual de acerto (%)</th>
                    </tr>
                    <tr id="perguntas">

                    </tr>
                    <tr id="acerto">

                    </tr>
                </table>
            </div>
        </div>
    </div>
    <script>
        var erros = []
        var acertos = []
        var qtd_acertos = []
        var qtd_conhecimento_futebol = []
        var qtd_conhecimento_tatico = []
        const grafico_userCad = document.getElementById('user_card');
        const grafico_sugestoes = document.getElementById('sugestoes');
        const grafico_userQuiz = document.getElementById('quiz_usuarios');

        let chartUserCad = new Chart(grafico_userCad, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Nível de Conhecimento sobre Táticas (0 a 10)',
                    data: [],
                    borderWidth: 1,
                    borderColor: '#3d195d',
                    backgroundColor: 'rgb (255, 0, 0)'
                },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        let chartSugestoes = new Chart(grafico_sugestoes, {
            type: 'doughnut',
            data: {

                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { display: false },
                    x: { display: false }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'right',
                        align: 'center',
                        labels: {
                            font: {
                                size: 20,
                                weight: 'bold'
                            },
                            boxWidth: 50,
                            padding: 20
                        }
                    },
                    layout: {
                        padding: {
                            right: 0
                        }
                    }
                }
            }
        });
        let chartUserQuiz = new Chart(grafico_userQuiz, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Top usuários com mais acertos no quiz',
                    data: [],
                    borderWidth: 1,
                    borderColor: '#3d195d',
                    backgroundColor: 'rgb (255, 0, 0)'
                },
                ],
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        display: false
                    }
                }
            }
        });
        var paginacao = {};

        function obterDadosGrafico() {

            fetch(`/dash/ultimas/dados`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                        resposta.reverse();
                        plotarGraficoQuiz(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });

                fetch(`/dash/ultimas/conhecimento`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                        resposta.reverse();
                        plotarGraficoConhecimento(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });

                fetch(`/dash/ultimas/sugestoes`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                        resposta.reverse();
                        plotarGraficoSugestoes(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
        }

        // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
        // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
        // A função *plotarGrafico* também invoca a função *atualizarGrafico*
        function plotarGraficoQuiz(resposta) {

            console.log('iniciando plotagem do gráfico...');
            console.log('----------------------------------------------')
            console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
            console.log(resposta)

            chartUserQuiz.data.labels = [];
            chartUserQuiz.data.datasets[0].data = [];
        

            // Inserindo valores recebidos em estrutura para plotar o gráfico
            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                chartUserQuiz.data.labels.push(registro.nome);
                chartUserQuiz.data.datasets[0].data.push(registro.acertos);               
            }

            chartUserQuiz.update();

            console.log('----------------------------------------------')
            console.log('O gráfico será plotado com os respectivos valores:')
            console.log('Labels:')
            console.log(labels)
            console.log('Dados:')
            console.log(dados.datasets)
            console.log('----------------------------------------------')

            // Criando estrutura para plotar gráfico - config
            setTimeout(() => atualizarGrafico(), 10000);
        }

        function plotarGraficoConhecimento(resposta) {

            console.log('iniciando plotagem do gráfico...');
            console.log('----------------------------------------------')
            console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
            console.log(resposta)

            chartUserCad.data.labels = [];
            chartUserCad.data.datasets[0].data = [];

            // Inserindo valores recebidos em estrutura para plotar o gráfico
            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                chartUserCad.data.labels.push(registro.nivel_conhecimento);
                chartUserCad.data.datasets[0].data.push(registro.qtd_usuarios);
               
            }


            chartUserCad.update();

            console.log('----------------------------------------------')
            console.log('O gráfico será plotado com os respectivos valores:')
            console.log('Labels:')
            console.log(labels)
            console.log('Dados:')
            console.log(dados.datasets)
            console.log('----------------------------------------------')

            // Criando estrutura para plotar gráfico - config
            setTimeout(() => atualizarGrafico(), 10000);
        }

        function plotarGraficoSugestoes(resposta) {

            console.log('iniciando plotagem do gráfico...');
            console.log('----------------------------------------------')
            console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
            console.log(resposta)

            chartSugestoes.data.labels = [];
            chartSugestoes.data.datasets[0].data = [];

            // Inserindo valores recebidos em estrutura para plotar o gráfico
            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                chartSugestoes.data.labels.push(registro.tipo_sugestao);
                chartSugestoes.data.datasets[0].data.push(registro.total);
            }


            chartSugestoes.update();

            console.log('----------------------------------------------')
            console.log('O gráfico será plotado com os respectivos valores:')
            console.log('Labels:')
            console.log(labels)
            console.log('Dados:')
            console.log(dados.datasets)
            console.log('----------------------------------------------')

            // Criando estrutura para plotar gráfico - config
            setTimeout(() => atualizarGrafico(), 10000);
        }


        // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
        // buscando a última medida inserida em tabela contendo as capturas, 

        //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
        //     Para ajustar o "select", ajuste o comando sql em src/models
        function atualizarGrafico() {
            fetch(`/dash/ultimas/dados`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (novoRegistro) {
                        console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                        console.log(`Dados atuais do gráfico:`);


                        if (novoRegistro[0].nome == chartUserQuiz.data.labels[chartUserQuiz.data.labels.length - 1]) {
                            console.log("---------------------------------------------------------------")
                            console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                            console.log("---------------------------------------------------------------")
                        } else {
                            // tirando e colocando valores no gráfico
                            chartUserQuiz.data.labels.shift(); // apagar o primeiro
                            chartUserQuiz.data.labels.push(novoRegistro[0].acertos); // incluir um novo momento
                            chartUserQuiz.data.datasets[0].data.shift();  // apagar o primeiro de temperatura
                            chartUserQuiz.data.datasets[0].data.push(novoRegistro[0].nome); // incluir uma nova medida de temperatura
                            chartUserQuiz.update();
                        }
                        proximaAtualizacao = setTimeout(() => atualizarGrafico(), 2000);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(), 2000);
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
        }
    </script>
</body>
