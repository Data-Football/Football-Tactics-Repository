<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style-dash.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/sessao.js"></script>
    <title>Football Tactics - Dashboard</title>
</head>

<body onload="validarSessao()">
    <header>
        <nav class="card-navbar txt-nav">
            <img src="./assets/img/DATA_FOOTBALL_branco-removebg-preview.png" alt="Logo da Football Tactics"
                class="img-nav">
            <button class="button-login" id="button_paginas"></button>
        </nav>
    </header>
    <div class="card-kpis">
        <div class="card-kpi-left">
            <h3>Média de conhecimento de futebol</h3>
            <span></span>
            <h4></h4>
        </div>
        <div class="card-kpi-center">
            <h3>Média de conhecimento tático</h3>
            <span></span>
            <h4></h4>
        </div>
        <div class="card-kpi-right">
            <h3>Média de acertos no quiz</h3>
            <span></span>
            <h4></h4>
        </div>
    </div>
    <div class="card-pai">
        <div class="card-left">
            <h3 class="txt-roxo">Analise Conhecimento Tático Usuário</h3>
            <div class="grafico-size grafico-nivel">
                <canvas id="user_card"></canvas>
            </div>
            <h3 class="txt-roxo">Sugestões recebidas</h3>
            <div class="grafico-sugestoes">
                <canvas id="sugestoes"></canvas>
            </div>
        </div>
        <div class="card-right">
            <h3 class="txt-roxo">Top usuários com mais acerto</h3>
            <div class="grafico-size grafico-quiz">
                <canvas id="quiz_usuarios"></canvas>
            </div>
            <h3 class="txt-roxo">Ranking de acertos de perguntas</h3>
            <div class="card-table">
                <table id="ranking">
                    <tr>
                        <th>Perguntas</th>
                        <th>Percentual de acerto (%)</th>
                    </tr>
                    <tr id="perguntas">
                        <th>fkdsnfnsd</th>
                        <th>andoandoasnd</th>
                    </tr>
                    <tr id="acerto">
                        <th>andkasndas</th>
                        <th>knaskndkas</th>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <script>
        const grafico_userCad = document.getElementById('user_card');
        const grafico_sugestoes = document.getElementById('sugestoes');
        const grafico_userQuiz = document.getElementById('quiz_usuarios');

        new Chart(grafico_userCad, {
            type: 'bar',
            data: {
                labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
                datasets: [{
                    label: 'Nível de Conhecimento sobre Táticas (0 a 10)',
                    data: [12, 19, 3, 5, 2, 3],
                    borderWidth: 1,
                    borderColor: 'rgb(255, 0, 0)',
                    backgroundColor: 'rgb (255, 0, 0)'
                },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        new Chart(grafico_sugestoes, {
            type: 'doughnut',
            data: {
                labels: ['Purple', 'Orange'],
                datasets: [{
                    label: 'Meu primeiro gráfico',
                    data: [2, 3],
                    borderWidth: 1,
                    borderColor: 'rgb(255, 0, 0)',
                    backgroundColor: 'rgb (255, 0, 0)',
                },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { display: false },
                    x: { display: false }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'right',
                        align: 'center',
                        labels: {
                            boxWidth: 20,
                            padding: 15
                        }
                    }
                }
            }
        });
        new Chart(grafico_userQuiz, {
            type: 'bar',
            data: {
                labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
                datasets: [{
                    label: 'Top usuários com mais acertos no quiz',
                    data: [12, 19, 3, 5, 2, 3],
                    borderWidth: 1,
                    borderColor: 'rgb(255, 0, 0)',
                    backgroundColor: 'rgb (255, 0, 0)'
                },
                ],
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        display: false
                    }
                }
            }
        });
        var paginacao = {};
        var tempo = {};

        function obterDados(grafico, endpoint) {
            fetch('/medidas/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo[endpoint]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor));
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
            obterDados(grafico_userCad, 'analogico');
            obterDados(grafico_sugestoes, 'digital');
        }, 5000);

    </script>
</body>
