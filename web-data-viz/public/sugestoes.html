<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style-sugestoes.css">
    <script src="js/sessao.js"></script>
    <link rel="icon" type="image/png" href="./assets/img/football_tactics_remove.png">
    <title>Football Tactics</title>
</head>
<body onload="validarSessao()">
    <div class="card-total">
        <header>
        <nav class="card-navbar txt-nav">
            <img src="./assets/img/DATA_FOOTBALL_branco-removebg-preview.png" alt="Logo da Football Tactics" class="img-nav">
            <div class="card-navbar-links">
                <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./taticas.html">Táticas</a></li>
                <li><a href="./tecnicos.html">Técnicos</a></li>
                <li><a href="./sugestoes.html">Sugestões</a></li>
                <li><a href="./quiz.html">Quiz</a></li>
                </ul>
            </div>
            <button class="button-login" id="button_paginas"></button>
        </nav>
    </header>
    <section>
        <div class="card-pai">
        <div class="card-img">
        </div>
        <div class="card-principal">
            <div class="card-form">
                <form id="form_cadastro">
                <h1 class="card-principal-h1-h2">Sugestões!</h1>
                <h2 class="card-principal-h1-h2">Tem alguma sugestão para fazer ao nosso trabalho?</h2>
                <label for="">Categoria:</label><br>
                <select name="" id="sel_categoria">
                    <option value="0" disabled selected>Selecione uma categoria</option>
                    <option value="Melhorias">Melhorias</option>
                    <option value="Links">Links</option>
                    <option value="Bugs">Bugs</option>
                    <option value="Reclamações">Reclamações</option>
                </select><br>
                <label for="">Assunto:</label>
                <input type="text" id="ipt_assunto">
                <label for="">Descrição</label><br>
                <textarea type="text" id="ipt_descricao" style="width: 100%;"></textarea>
            </form><br>
            <div class="card-botoes">
                    <button onclick="sugestao()" id="btn_sugestao" class="botao-form">Enviar sugestão</button><br>
            </div><br>
            </div>
        </div>
            <div class="teste" id="div_msg"></div>
        </div>
    </div>
    </section>
        <div class="card-footer txt-footer footer">
            <div class="footer-left">
                <h2>Contato</h2>
                <a href="mailto: joao.fcunha@sptech.school">joao.fcunha@sptech.school</a>
            </div>
            <div class="card-navbar-links footer-center">
                <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./taticas.html">Táticas</a></li>
                <li><a href="./tecnicos.html">Técnicos</a></li>
                <li><a href="./sugestoes.html">Sugestões</a></li>
                <li><a href="./quiz.html">Quiz</a></li>
                </ul>
            </div>
            <div class="footer-right">
                <img src="./assets/img/football_tactics_remove.png" alt="Logo da Football Tactics" class="img-footer">
                <p>© 2026 Football Tactics -
                <br> Todos os direitos reservados.</p>
            </div>
        </div>
    </section>
    </div>
</body>
<script>
    let id_pessoa = sessionStorage.ID_USUARIO
    function sugestao() {
        let tipo = sel_categoria.value;
        let assunto = ipt_assunto.value;
        let descricao = ipt_descricao.value;

        if (assunto == '' || descricao == '') {
            div_msg.innerHTML = 'Insira informações válidas'
        } else {
             fetch("/aquarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    Tipo: tipo,
                    Id: id_pessoa,
                    Assunto: assunto,
                    Descricao: descricao
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);
                    if (resposta.ok) {
                        alert('Formulário enviado!')
                    } else {
                        throw "Houve um erro ao tentar realizar o envio do formulário!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`)
                });

                return false;
        }
    }
    function login() {
        window.location.href = './login.html';
    }
    function taticas() {
        window.location.href = './taticas.html';
    }
</script>
</html>
