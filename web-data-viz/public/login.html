<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Tactics - Cadastro</title>
    <link rel="stylesheet" href="./css/style-login.css">
</head>

<body>

    <div class="card-pai">
        <div class="card-img">
            <img src="./assets/img/DATA_FOOTBALL_branco-removebg-preview.png" alt="">
        </div>
        <div class="card-principal">
            <div class="card-form">
                <form id="form_cadastro">
                <h1>Bem-vindo, novamente!</h1>
                <h2>Preencha as informaçãos abaixo para entrar</h2>
                <label>Informe o seu nome de usuário</label><br>
                <input type="text" id="ipt_user_name" placeholder="Ex: Usuario123"><br>
                <label>Informe uma senha</label><br>
                <input type="password" id="ipt_senha" placeholder="********"><br><br>    
            </form>
            <div class="card-botoes">
                    <button onclick="login()" id="login" class="botao-form">Login</button><br>
                    <label>Ainda não se cadastrou? Clique no botão abaixo</label><br>
                    <button onclick="cadastro()" id="cadastro" class="botao-form">Realizar cadastro</button>
            </div><br>
            </div>
        </div>
            <div class="teste"></div>
        </div>
    </div>
</body>
<script>
    let Cadastro = JSON.parse(localStorage.getItem('DadosCadastrados'))
    function cadastro() {
            window.location.href = './cadastro.html'
        }
    function login() {
        let user_name = ipt_user_name.value;
        let senha = ipt_senha.value;
        let validacao_user = 0
        let validacao_senha = 0
        for (let i = 0; i < Cadastro.length; i++) {
            if (Cadastro[i].User === user_name) {
                validacao_user = 1
                i = Cadastro.length
            }
        }
        for (let i = 0; i < Cadastro.length; i++) {
            if (Cadastro[i].Senha === senha) {
                validacao_senha = 1
                i = Cadastro.length
            }
        }
        if (validacao_user == 1 && validacao_senha == 1) {
            alert(`Bem-vindo ${user_name}!`)
            window.location.href = './quiz.html'
        }
        if (validacao_user == 0) {
            alert('Usuário incorreta!')
        }
        if (validacao_senha == 0) {
            alert('Senha incorreta!')
        } 
           
    }
</script>
</html>
