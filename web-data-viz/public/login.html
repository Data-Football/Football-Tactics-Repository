<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Tactics - Cadastro</title>
    <link rel="stylesheet" href="./css/style-login.css">
    <link rel="stylesheet" href="js/sessao.js">
</head>

<body>

    <div class="card-pai">
        <div class="card-img">
            <img src="./assets/img/DATA_FOOTBALL_branco-removebg-preview.png" alt="">
        </div>
        <div class="card-principal">
            <div class="card-form">
                <form id="form_cadastro">
                    <h1>Bem-vindo, novamente!</h1>
                    <h2>Preencha as informaçãos abaixo para entrar</h2>
                    <label>Informe o seu nome de usuário</label><br>
                    <input type="text" id="ipt_user_name" placeholder="Ex: Usuario123"><br>
                    <label>Informe uma senha</label><br>
                    <input type="password" id="ipt_senha" placeholder="********"><br><br>
                </form>
                <div class="card-botoes">
                    <button onclick="login()" id="login" class="botao-form">Login</button><br>
                    <label>Ainda não se cadastrou? Clique no botão abaixo</label><br>
                    <button onclick="cadastro()" id="cadastro" class="botao-form">Realizar cadastro</button>
                </div><br>
            </div>
        </div>
        <div class="teste"></div>
    </div>
    </div>
</body>
<script>
    function cadastro() {
        window.location.href = './cadastro.html'
    }
    function login() {
        let user_name = ipt_user_name.value;
        let senha = ipt_senha.value;
        if (user_name == '' || senha == '') {
            alert("Preencha todos os campos para realizar o login")
        } else {
            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    User: user_name,
                    Senha: senha
                })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!")

                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(json => {
                        console.log(json);
                        console.log(JSON.stringify(json));
                        sessionStorage.USER_USUARIO = json.User;
                        sessionStorage.SENHA_USUARIO = json.Senha;
                        sessionStorage.AUTENTICACAO = JSON.stringify(json.Autenticacao)
                        
                        setTimeout(function () {
                            alert(`Bem-vindo ${user_name}`)
                            window.location.href = "quiz.html";
                        }, 1000); // apenas para exib   ir o loading

                    });

                } else {
                    alert("Usuário ou senha incorreto")
                    console.log("Houve um erro ao tentar realizar o login!");

                }

            }).catch(function (erro) {
                console.log(erro);
            })

            return false;
        }

    }
</script>

</html>
